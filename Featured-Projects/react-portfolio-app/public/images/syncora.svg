<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Syncora video editor</title>
  <desc id="desc">Syncora title and a purple animated music player on a dark background.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#151020"/>
      <stop offset="1" stop-color="#0b0a12"/>
    </linearGradient>
    <radialGradient id="record" cx=".35" cy=".28" r=".8">
      <stop stop-color="#b78aff"/>
      <stop offset=".53" stop-color="#673bb0"/>
      <stop offset="1" stop-color="#201230"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" rx="20" fill="url(#background)"/>
  <path d="M25 0v360M210 0v360M400 0v360" stroke="#baa1e6" stroke-opacity=".08"/>
  <text x="45" y="78" fill="#bea6df" font-family="Arial,sans-serif" font-size="13" font-weight="bold" letter-spacing="4">MUSIC VIDEO / CREATIVE WORKSPACE</text>
  <text x="43" y="185" fill="#faf7ff" font-family="Arial,sans-serif" font-size="72" font-weight="bold" letter-spacing="-5">Syncora</text>
  <text x="46" y="236" fill="#c4a8ff" font-family="Arial,sans-serif" font-size="28" font-weight="bold">Cut to the feeling.</text>
  <rect x="345" y="48" width="252" height="258" rx="22" fill="#21172f" stroke="#8e60d5" stroke-opacity=".55"/>
  <text x="370" y="78" fill="#d5baff" font-family="Arial,sans-serif" font-size="11" font-weight="bold" letter-spacing="2">NOW PLAYING</text>
  <circle cx="471" cy="170" r="71" fill="url(#record)" stroke="#be9aec" stroke-opacity=".5"/>
  <circle cx="471" cy="170" r="51" fill="none" stroke="#e1c7ff" stroke-opacity=".2"/>
  <circle cx="471" cy="170" r="30" fill="#1c102d" stroke="#e2ceff" stroke-opacity=".6"/>
  <path d="M464 156v28l22-14z" fill="#f7efff"/>
  <rect x="370" y="266" width="200" height="4" rx="2" fill="#5a426c"/>
  <rect x="370" y="266" width="92" height="4" rx="2" fill="#c296ff"/>
  <circle cx="462" cy="268" r="5" fill="#d2afff"/>
</svg>
