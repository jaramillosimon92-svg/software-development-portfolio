<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linux Command Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@300;400;600&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --card: #1a1a1a;
    --border: #2a2a2a;
    --accent: #00ff88;
    --accent2: #00ccff;
    --wrong: #ff4466;
    --text: #e8e8e8;
    --muted: #666;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'Space Grotesk', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(0,255,136,0.04) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(0,204,255,0.04) 0%, transparent 50%);
  }

  header {
    width: 100%;
    max-width: 700px;
    margin-bottom: 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .logo span { color: var(--muted); }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }

  .progress-bar {
    width: 120px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 2px;
    transition: width 0.4s ease;
  }

  /* Score tally */
  .tally {
    display: flex;
    gap: 16px;
    font-family: var(--mono);
    font-size: 12px;
  }

  .tally-correct { color: var(--accent); }
  .tally-wrong { color: var(--wrong); }

  /* Card */
  .card-wrapper {
    width: 100%;
    max-width: 700px;
    perspective: 1200px;
    margin-bottom: 24px;
  }

  .card {
    position: relative;
    width: 100%;
    min-height: 280px;
    border-radius: 16px;
    border: 1px solid var(--border);
    background: var(--card);
    padding: 36px 36px 28px;
    transition: transform 0.05s;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
  }

  .card-number {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .card-question {
    font-size: 17px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 28px;
  }

  .card-question code {
    font-family: var(--mono);
    font-size: 14px;
    background: rgba(0,255,136,0.08);
    color: var(--accent);
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid rgba(0,255,136,0.15);
  }

  /* Options */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    text-align: left;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    transition: border-color 0.2s, background 0.2s, transform 0.1s;
    line-height: 1.5;
  }

  .option-btn:hover:not(:disabled) {
    border-color: rgba(0,255,136,0.3);
    background: rgba(0,255,136,0.04);
    transform: translateX(3px);
  }

  .option-btn:disabled { cursor: default; }

  .option-btn.correct {
    border-color: var(--accent);
    background: rgba(0,255,136,0.08);
    color: var(--accent);
  }

  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(255,68,102,0.08);
    color: var(--wrong);
  }

  .option-btn .key {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 700;
    min-width: 22px;
    height: 22px;
    border-radius: 5px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 1px;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }

  .option-btn.correct .key {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .option-btn.wrong .key {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }

  .option-btn code {
    font-family: var(--mono);
    font-size: 13px;
    background: rgba(255,255,255,0.06);
    padding: 1px 5px;
    border-radius: 3px;
  }

  /* Feedback bar */
  .feedback {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.5;
    display: none;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .feedback.show { display: block; }
  .feedback.correct { background: rgba(0,255,136,0.08); border: 1px solid rgba(0,255,136,0.25); color: var(--accent); }
  .feedback.wrong { background: rgba(255,68,102,0.08); border: 1px solid rgba(255,68,102,0.25); color: #ff7799; }

  .feedback strong { color: inherit; }

  /* Nav */
  .nav {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 12px 24px;
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    color: var(--muted);
  }

  .btn:hover { border-color: rgba(0,255,136,0.4); color: var(--text); }

  .btn.primary {
    background: rgba(0,255,136,0.1);
    border-color: rgba(0,255,136,0.4);
    color: var(--accent);
  }

  .btn.primary:hover { background: rgba(0,255,136,0.2); }
  .btn:disabled { opacity: 0.3; cursor: default; }

  /* Result screen */
  .result-screen {
    display: none;
    width: 100%;
    max-width: 700px;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }

  .result-screen.show { display: block; }

  .result-score {
    font-family: var(--mono);
    font-size: 72px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin-bottom: 8px;
  }

  .result-label {
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 32px;
    font-family: var(--mono);
  }

  .missed-list {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    text-align: left;
    margin-bottom: 24px;
  }

  .missed-list h3 {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--wrong);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .missed-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    line-height: 1.5;
  }

  .missed-item:last-child { border-bottom: none; }
  .missed-item .q { color: var(--muted); margin-bottom: 4px; }
  .missed-item .a { color: var(--accent); font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>

<header>
  <div class="logo">$ linux<span>_</span>quiz.sh</div>
  <div style="display:flex;gap:20px;align-items:center">
    <div class="tally">
      <span class="tally-correct" id="tally-correct">✓ 0</span>
      <span class="tally-wrong" id="tally-wrong">✗ 0</span>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <span id="progress-text">0 / 40</span>
    </div>
  </div>
</header>

<!-- Flashcard -->
<div class="card-wrapper" id="card-wrapper">
  <div class="card" id="card">
    <div class="card-number" id="card-number">Q1 · CARD 1 OF 40</div>
    <div class="card-question" id="card-question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<div class="nav">
  <button class="btn" id="btn-prev" onclick="prev()">← Prev</button>
  <button class="btn primary" id="btn-next" onclick="next()" disabled>Next →</button>
  <button class="btn" onclick="shuffle()">⇄ Shuffle</button>
</div>

<!-- Result screen -->
<div class="result-screen" id="result-screen">
  <div class="result-score" id="result-score"></div>
  <div class="result-label" id="result-label"></div>
  <div class="missed-list" id="missed-list"></div>
  <div class="nav" style="justify-content:center">
    <button class="btn primary" onclick="restart()">↺ Restart</button>
    <button class="btn" onclick="restartMissed()">↺ Practice Missed</button>
  </div>
</div>

<script>
const ALL_CARDS = [
  {
    q: "Which grep command finds lines that do NOT start with a numeric character in f.txt?",
    options: ["grep '^[0-9]' f.txt", "grep '^[0-9]^' f.txt", "grep '^[^0-9]' f.txt", "grep '[^0-9]' f.txt", "grep '^[^0-9]$' f.txt"],
    answer: 2,
    explain: "^[^0-9] anchors to start of line (^) then negates digits ([^0-9])."
  },
  {
    q: "chmod 715 f1.txt sets which permissions?",
    options: [
      "user: read, write | group: execute | others: read, execute",
      "user: read, write, execute | group: execute | others: read, execute",
      "user: read, write, execute | group: write, execute | others: read, execute",
      "user: read, write, execute | group: execute | others: write"
    ],
    answer: 1,
    explain: "7=rwx, 1=x, 5=r-x → user: rwx | group: --x | others: r-x"
  },
  {
    q: "True or False: The kernel is a layer between computer hardware and software.",
    options: ["True", "False"],
    answer: 0,
    explain: "The kernel manages hardware resources and provides an interface between hardware and user-space software."
  },
  {
    q: "Which command creates all directories ~/a/b/c/d at once?",
    options: ["mkdir -all ~/a/b/c/d", "mkdir -p ~/a/b/c/d", "mkdir ~/a/b/c/d", "mkdir ~ a b c d"],
    answer: 1,
    explain: "mkdir -p creates parent directories as needed."
  },
  {
    q: "Command to rename directory d1 to d11 (d11 does not exist)?",
    options: ["renmove d1 d11", "cp d1 d11", "ren d1 d11", "mv d1 d11"],
    answer: 3,
    explain: "mv is used to rename files and directories when the destination doesn't exist."
  },
  {
    q: "Which operator sends command error output to a text file?",
    options: ["2>", "&>", "|"],
    answer: 0,
    explain: "2> redirects stderr (file descriptor 2). &> redirects both stdout and stderr."
  },
  {
    q: "umask 441 results in a new file created with which permissions?",
    options: [
      "Correct mask but requires admin permission",
      "Incorrect user mask value",
      "User: write | Group: write | Others: read, write",
      "User: read | Group: read | Others: execute",
      "User: read, write | Group: read, write | Others: read"
    ],
    answer: 2,
    explain: "Default file perms 666 minus umask 441 = 226 → User: -w- | Group: -w- | Others: rw-"
  },
  {
    q: "In sed 's/old/new/g', what does the 'g' flag mean?",
    options: ["g has no special meaning", "g means every line, all occurrences", "g means every line, first occurrence", "g means generate output"],
    answer: 1,
    explain: "'g' = global: replace ALL occurrences on each line (without it, only the first per line is replaced)."
  },
  {
    q: "True or False: Pipe simplifies creating plain text files.",
    options: ["True", "False"],
    answer: 1,
    explain: "Pipes (|) pass output of one command as input to another — they don't create files. Use > for that."
  },
  {
    q: "Which command sets default permissions of files and folders?",
    options: ["chown", "default", "umask", "chmod"],
    answer: 2,
    explain: "umask sets the default creation mask. chmod changes existing file permissions."
  },
  {
    q: "Copy f1.txt and f2.txt from home directory to root directory:",
    options: ["cp f1.txt f2.txt root", "cp ~/f1.txt ~/f2.txt /", "cp ./f1.txt ./f2.txt /", "cp ~/f1.txt f2.txt /"],
    answer: 1,
    explain: "~/ expands to the home directory; / is the root directory. Both source files need the ~ prefix."
  },
  {
    q: "The exit status code of the last command is stored in which variable?",
    options: ["$PPID", "$0", "$?", "$*", "$#"],
    answer: 2,
    explain: "$? holds the exit status of the most recently executed command."
  },
  {
    q: "True or False: Output redirection sends the output of one command into the input of another.",
    options: ["True", "False"],
    answer: 1,
    explain: "That describes a pipe (|). Output redirection (>) sends output to a FILE."
  },
  {
    q: "Command to create a symbolic link named link1 pointing to file1?",
    options: ["ln -s link1 file1", "ln link1 file1", "ln file1 link1", "ln -s file1 link1"],
    answer: 3,
    explain: "Syntax: ln -s TARGET LINK_NAME — so ln -s file1 link1 creates link1 → file1."
  },
  {
    q: "Send output of ls -R to f1.txt, overwriting its content:",
    options: ["ls -R > f1.txt", "ls -R | f1.txt", "overwrite f1.txt with ls -R", "ls -R >> f1.txt"],
    answer: 0,
    explain: "> overwrites (truncates) the file. >> appends to it."
  },
  {
    q: "awk operations are useful for:",
    options: ["Only B", "Only A and B", "Only A", "Only A and C", "Only C", "A, B, and C"],
    answer: 5,
    explain: "awk is a powerful text processing tool useful for pattern scanning, text transformation, and reporting (A, B, and C)."
  },
  {
    q: "Which grep command matches empty lines?",
    options: ["grep -in '' f.txt", "grep --empty f.txt", "grep '' f.txt", "grep '$^' f.txt", "grep '^$' f.txt"],
    answer: 4,
    explain: "^$ matches start-of-line followed immediately by end-of-line = empty line."
  },
  {
    q: "grep command for lines with only spaces (at least one space)?",
    options: ["grep ' *' f.txt", "grep -E '^ +$' f.txt", "grep ' +' f.txt", "grep '^ *$' f.txt", "grep -E '^ *$' f.txt", "grep '^ +$' f.txt"],
    answer: 1,
    explain: "^ +$ with -E (extended regex) matches lines with one or more spaces and nothing else. grep '^ +$' without -E doesn't treat + as special."
  },
  {
    q: "Command to execute commands as root (superuser)?",
    options: ["su", "asroot", "root", "sudo"],
    answer: 3,
    explain: "sudo runs a command as another user (default: root). su switches the current user entirely."
  },
  {
    q: "True or False: /etc/passwd is an example of a flat file database.",
    options: ["True", "False"],
    answer: 0,
    explain: "/etc/passwd stores user account info in a plain, colon-delimited text file — a classic flat file database."
  },
  {
    q: "Command to remove all folders in /a/b/c/d including files inside?",
    options: ["rmdir /a/b/c/d", "rmdir -p /a/b/c/d", "rm a -r", "rm /a/b/c/d -r"],
    answer: 3,
    explain: "rm -r (recursive) removes directories and their contents. rmdir only removes empty directories."
  },
  {
    q: "In regex, the list operator [ ] does what?",
    options: ["Matches any one character", "Defines a list or range of characters", "Matches zero or more of previous character", "All of the above", "None of the above"],
    answer: 1,
    explain: "[abc] or [a-z] defines a character class — it matches any ONE character from the defined list/range."
  },
  {
    q: "sed command to remove the first 10 lines of a file?",
    options: ["sed '1-10d' < filename", "sed '/1/,/10/d' < filename", "sed '1,10d' < filename", "sed '/1,10/d' < filename"],
    answer: 2,
    explain: "sed '1,10d' uses an address range (line 1 to 10) with the delete command d."
  },
  {
    q: "grep command for lines starting with w or W and ending with a dot (.)?",
    options: ["grep '^[wW].*.' f.txt", "grep -i '^w*.$' f.txt", "grep '^[wW].*.$' f.txt", "grep '^[wW]*.$' f.txt", "grep '[^wW].*.$' f.txt"],
    answer: 2,
    explain: "^[wW] = starts with w/W, .* = any chars, \\. = literal dot, $ = end of line."
  },
  {
    q: "What does grep '[Uu]nix' ch?/* do?",
    options: [
      "Search Unix/unix in all files",
      "Search Unix/unix in all directories",
      "Search Unix/unix in files inside directories matching ch?",
      "Search Unix AND unix in matching directories"
    ],
    answer: 2,
    explain: "ch?/* — ch? matches directories like ch1, ch2; /* expands to files inside those directories."
  },
  {
    q: "Command to list root directory including hidden files?",
    options: ["ls -R root", "ls -long&hidden; root", "ls -la /", "lsl -la ~/"],
    answer: 2,
    explain: "ls -la / : -l = long format, -a = all (including hidden), / = root directory."
  },
  {
    q: "Command where the second command runs only if the first FAILS?",
    options: ["cal > date", "cal ; date", "cal && date", "cal || date", "cal &> date", "cal | date"],
    answer: 3,
    explain: "|| is OR — runs the right side only if the left side returns a non-zero (failure) exit status."
  },
  {
    q: "Command to execute a command as another user?",
    options: ["exec", "user", "su", "sudo", "run"],
    answer: 2,
    explain: "su (switch user) lets you run commands as another user. sudo runs a single command with elevated privileges."
  },
  {
    q: "Command to display the current working directory?",
    options: ["cd", "where", "$PATH", "pwd", "ls", "$PWD"],
    answer: 3,
    explain: "pwd = Print Working Directory. $PWD is the variable holding it, but pwd is the command."
  },
  {
    q: "True or False: Regex * is the same as glob *?",
    options: ["True", "False"],
    answer: 1,
    explain: "Glob * matches any string of characters. Regex * means 'zero or more of the preceding element' — very different!"
  },
  {
    q: "Which environment variable holds the exit status of the last command?",
    options: ["$#", "#*", "$?"],
    answer: 2,
    explain: "$? stores the exit status code. 0 = success, non-zero = error."
  },
  {
    q: "In regex, the period operator . means?",
    options: ["Matches any one character", "Defines list", "Matches zero or more", "Start of line", "End of line"],
    answer: 0,
    explain: "The regex . matches any single character (except newline by default)."
  },
  {
    q: "In regex, the * operator means?",
    options: ["Matches any one character", "Defines list", "Matches zero or more of previous", "Start of line", "End of line"],
    answer: 2,
    explain: "a* means zero or more 'a' characters. Unlike glob *, it operates on the preceding element."
  },
  {
    q: "True or False: Both cp and mv require an option to copy/move folders?",
    options: ["True", "False"],
    answer: 1,
    explain: "mv works on directories without any option. Only cp requires -r to copy directories recursively."
  },
  {
    q: "Command to copy f1.txt to the home directory?",
    options: ["cp f1.txt ~/", "cp f1.txt account_home_dir", "mv f1.txt ~/", "copy f1.txt ~/"],
    answer: 0,
    explain: "cp f1.txt ~/ copies f1.txt into your home directory. mv would move (remove) the original."
  },
  {
    q: "Which variable stores the number of command-line arguments?",
    options: ["$?", "$!", "$#"],
    answer: 2,
    explain: "$# holds the count of positional parameters (arguments) passed to a script."
  }
];

let cards = [...ALL_CARDS];
let current = 0;
let answered = new Set();
let correct = 0;
let wrong = 0;
let wrongCards = [];
let isReviewMode = false;

function render() {
  const total = cards.length;
  const card = cards[current];
  const qNum = current + 1;

  document.getElementById('card-number').textContent = `CARD ${qNum} OF ${total}`;
  document.getElementById('card-question').innerHTML = formatText(card.q);

  const opts = document.getElementById('options');
  opts.innerHTML = '';
  card.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.innerHTML = `<span class="key">${String.fromCharCode(65+i)}</span><span>${formatText(opt)}</span>`;
    btn.onclick = () => selectOption(i);
    opts.appendChild(btn);
  });

  document.getElementById('feedback').className = 'feedback';
  document.getElementById('feedback').innerHTML = '';
  document.getElementById('btn-next').disabled = !answered.has(current);
  document.getElementById('btn-prev').disabled = current === 0;

  // Re-apply state if already answered
  if (answered.has(current)) {
    applyAnswered(card, cards[current]._chosen);
  }

  // Progress
  const pct = (answered.size / total) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${answered.size} / ${total}`;
}

function formatText(str) {
  // Wrap backtick-like patterns in code tags
  return str.replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\b(grep|sed|awk|chmod|mkdir|mv|cp|ln|rm|ls|pwd|su|sudo|umask|chown|rmdir)\b(?=[^<])/g, '<code>$1</code>');
}

function selectOption(i) {
  if (answered.has(current)) return;
  const card = cards[current];
  card._chosen = i;
  answered.add(current);

  const isCorrect = i === card.answer;
  if (isCorrect) {
    correct++;
    document.getElementById('tally-correct').textContent = `✓ ${correct}`;
  } else {
    wrong++;
    document.getElementById('tally-wrong').textContent = `✗ ${wrong}`;
    if (!wrongCards.find(c => c === card)) wrongCards.push(card);
  }

  applyAnswered(card, i);
  document.getElementById('btn-next').disabled = false;

  const pct = (answered.size / cards.length) * 100;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${answered.size} / ${cards.length}`;

  if (answered.size === cards.length && current === cards.length - 1) {
    setTimeout(showResult, 800);
  }
}

function applyAnswered(card, chosen) {
  const btns = document.querySelectorAll('.option-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === card.answer) btn.classList.add('correct');
    else if (i === chosen && chosen !== card.answer) btn.classList.add('wrong');
  });

  const fb = document.getElementById('feedback');
  const isCorrect = chosen === card.answer;
  fb.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;
  fb.innerHTML = isCorrect
    ? `<strong>✓ Correct!</strong> ${card.explain}`
    : `<strong>✗ Incorrect.</strong> The correct answer is <strong>${String.fromCharCode(65+card.answer)}</strong>. ${card.explain}`;
}

function next() {
  if (current < cards.length - 1) {
    current++;
    render();
  } else {
    showResult();
  }
}

function prev() {
  if (current > 0) {
    current--;
    render();
  }
}

function shuffle() {
  cards = cards.sort(() => Math.random() - 0.5);
  current = 0;
  answered = new Set();
  correct = 0;
  wrong = 0;
  wrongCards = [];
  document.getElementById('tally-correct').textContent = '✓ 0';
  document.getElementById('tally-wrong').textContent = '✗ 0';
  render();
}

function showResult() {
  document.getElementById('card-wrapper').style.display = 'none';
  document.querySelector('.nav').style.display = 'none';
  const rs = document.getElementById('result-screen');
  rs.classList.add('show');

  const total = cards.length;
  const pct = Math.round((correct / total) * 100);
  document.getElementById('result-score').textContent = `${pct}%`;
  document.getElementById('result-label').textContent = `${correct} correct out of ${total} · ${wrong} missed`;

  const ml = document.getElementById('missed-list');
  if (wrongCards.length === 0) {
    ml.innerHTML = '<h3>Perfect score!</h3><p style="color:var(--accent);font-size:14px;margin-top:8px">You got every question right 🎉</p>';
  } else {
    ml.innerHTML = `<h3>Missed questions (${wrongCards.length})</h3>` +
      wrongCards.map(c => `
        <div class="missed-item">
          <div class="q">${c.q}</div>
          <div class="a">✓ ${c.options[c.answer]}</div>
        </div>
      `).join('');
  }
}

function restart() {
  cards = [...ALL_CARDS];
  cards.forEach(c => delete c._chosen);
  current = 0;
  answered = new Set();
  correct = 0;
  wrong = 0;
  wrongCards = [];
  document.getElementById('tally-correct').textContent = '✓ 0';
  document.getElementById('tally-wrong').textContent = '✗ 0';
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('card-wrapper').style.display = 'block';
  document.querySelector('.nav').style.display = 'flex';
  render();
}

function restartMissed() {
  if (wrongCards.length === 0) { restart(); return; }
  cards = wrongCards.map(c => { delete c._chosen; return c; });
  current = 0;
  answered = new Set();
  correct = 0;
  wrong = 0;
  wrongCards = [];
  document.getElementById('tally-correct').textContent = '✓ 0';
  document.getElementById('tally-wrong').textContent = '✗ 0';
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('card-wrapper').style.display = 'block';
  document.querySelector('.nav').style.display = 'flex';
  render();
}

// Keyboard nav
document.addEventListener('keydown', e => {
  const card = cards[current];
  if (!answered.has(current)) {
    const idx = e.key.toUpperCase().charCodeAt(0) - 65;
    if (idx >= 0 && idx < card.options.length) { selectOption(idx); return; }
  }
  if (e.key === 'ArrowRight' || e.key === 'Enter') { if (!document.getElementById('btn-next').disabled) next(); }
  if (e.key === 'ArrowLeft') prev();
});

render();
</script>
</body>
</html>
