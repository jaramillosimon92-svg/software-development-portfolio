<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Book an Appointment</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">

	<div class="container mt-5">
		<div class="card shadow mx-auto" style="max-width: 600px;">

			<div class="card-body p-4">

				<h1 class="text-center text-primary mb-4">Book an Appointment</h1>

				<form method="post" action="/formPost">

					<div class="mb-3">
						<label class="form-label" for="firstName"> First Name </label> <input
							class="form-control" type="text" id="firstName" name="firstName"
							required>
					</div>

					<div class="mb-3">
						<label class="form-label" for="email"> Email </label> <input
							class="form-control" type="email" id="email" name="email"
							required>
					</div>

					<div class="mb-3">
						<label class="form-label" for="appointmentDate">
							Appointment Date </label> <input class="form-control" type="date"
							id="appointmentDate" name="appointmentDate" required>
					</div>

					<div class="mb-3">
						<label class="form-label" for="appointmentTime">
							Appointment Time </label> <input class="form-control" type="time"
							id="appointmentTime" name="appointmentTime" required>
					</div>

					<button class="btn btn-primary w-100" type="submit">Book
						Appointment</button>

				</form>
			</div>
		</div>
	</div>

</body>
</html>
